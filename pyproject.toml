[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diskforge"
version = "0.7.0"
description = "Multilingual cross-platform disk image studio built with Python and Qt"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DiskForge Contributors"}]
keywords = ["disk-image", "iso", "vhd", "fat", "forensics", "backup", "qt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "PySide6>=6.6",
  "pyfatfs>=1.1.0",
  "pycdlib>=1.14.0",
  "cryptography>=42.0",
  "psutil>=5.9",
  "jaraco.text>=4.3",
  "setuptools>=69,<80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "PyInstaller>=6.0"]

[project.scripts]
diskforge = "diskforge.app:main"
diskforge-cli = "diskforge.cli:main"

[tool.setuptools]
packages = ["diskforge", "diskforge.core", "diskforge.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pyinstaller]
name = "DiskForge"
