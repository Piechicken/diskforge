name: Validate and package DiskForge

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            os: windows-latest
          - id: linux-x64
            label: Linux x64
            os: ubuntu-latest
          - id: macos-intel-x64
            label: macOS Intel x64
            os: macos-26-intel
          - id: macos-arm64
            label: macOS Apple Silicon
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 binutils libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Install project
        run: python -m pip install --upgrade pip "setuptools>=69,<80" && python -m pip install -e ".[dev]"
      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -W error
      - name: GUI smoke test
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/gui_smoke.py
      - name: Upload GUI screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: gui-smoke
          path: artifacts/main-window.png

  package:
    name: Package ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            os: windows-latest
          - id: linux-x64
            label: Linux x64
            os: ubuntu-latest
          - id: macos-intel-x64
            label: macOS Intel x64
            os: macos-26-intel
          - id: macos-arm64
            label: macOS Apple Silicon
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils libegl1 zip libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip "setuptools>=69,<80" && python -m pip install -e ".[dev]"
      - name: Build native package
        run: python scripts/build.py
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path dist/DiskForge -DestinationPath release/DiskForge-${{ github.ref_name }}-${{ matrix.id }}.zip -Force
      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          (cd dist && zip -r "../release/DiskForge-${{ github.ref_name }}-${{ matrix.id }}.zip" DiskForge)
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/DiskForge.app" "release/DiskForge-${{ github.ref_name }}-${{ matrix.id }}.zip"
      - name: Upload release package
        uses: actions/upload-artifact@v6
        with:
          name: DiskForge-${{ matrix.id }}
          path: release/DiskForge-${{ github.ref_name }}-${{ matrix.id }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish ${{ github.ref_name }}
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download platform packages from this workflow
        uses: actions/download-artifact@v7
        with:
          pattern: DiskForge-*
          path: release
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          cd release
          sha256sum "DiskForge-${GITHUB_REF_NAME}-"*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify tag matches project version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${VERSION}" = "$GITHUB_REF_NAME"
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; versioned release assets are immutable."
            exit 1
          fi
          gh release create "$VERSION" release/DiskForge-"$VERSION"-*.zip release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "DiskForge $VERSION" --notes-file CHANGELOG.md --repo "$GITHUB_REPOSITORY"
