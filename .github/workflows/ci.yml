name: Validate and package DiskForge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 binutils
      - name: Install project
        run: python -m pip install --upgrade pip "setuptools>=69,<81" && python -m pip install -e ".[dev]"
      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: GUI smoke test
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/gui_smoke.py
      - name: Upload GUI screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke
          path: artifacts/main-window.png

  package:
    name: Package ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils libegl1
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip "setuptools>=69,<81" && python -m pip install -e ".[dev]"
      - name: Build native package
        run: python scripts/build.py
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: DiskForge-${{ matrix.os }}
          path: dist/
