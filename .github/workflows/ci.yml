name: Validate and package DiskForge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            os: windows-latest
          - id: linux-x64
            label: Linux x64
            os: ubuntu-latest
          - id: macos-intel-x64
            label: macOS Intel x64
            os: macos-26-intel
          - id: macos-arm64
            label: macOS Apple Silicon
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 binutils
      - name: Install project
        run: python -m pip install --upgrade pip "setuptools>=69,<80" && python -m pip install -e ".[dev]"
      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -W error
      - name: GUI smoke test
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/gui_smoke.py
      - name: Upload GUI screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: gui-smoke
          path: artifacts/main-window.png

  package:
    name: Package ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            os: windows-latest
            archive: DiskForge-v0.5.0-windows-x64.zip
          - id: linux-x64
            label: Linux x64
            os: ubuntu-latest
            archive: DiskForge-v0.5.0-linux-x64.zip
          - id: macos-intel-x64
            label: macOS Intel x64
            os: macos-26-intel
            archive: DiskForge-v0.5.0-macos-intel-x64.zip
          - id: macos-arm64
            label: macOS Apple Silicon
            os: macos-latest
            archive: DiskForge-v0.5.0-macos-arm64.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils libegl1 zip
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip "setuptools>=69,<80" && python -m pip install -e ".[dev]"
      - name: Build native package
        run: python scripts/build.py
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path dist/DiskForge -DestinationPath release/${{ matrix.archive }} -Force
      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          (cd dist && zip -r "../release/${{ matrix.archive }}" DiskForge)
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/DiskForge.app" "release/${{ matrix.archive }}"
      - name: Upload release package
        uses: actions/upload-artifact@v6
        with:
          name: DiskForge-${{ matrix.id }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish v0.5.0
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download platform packages from this workflow
        uses: actions/download-artifact@v7
        with:
          pattern: DiskForge-*
          path: release
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          cd release
          sha256sum DiskForge-v0.5.0-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v0.5.0
        shell: bash
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/DiskForge-v0.5.0-*.zip release/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$VERSION" --title "DiskForge $VERSION" --notes-file CHANGELOG.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION" release/DiskForge-v0.5.0-*.zip release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "DiskForge $VERSION" --notes-file CHANGELOG.md --repo "$GITHUB_REPOSITORY"
          fi
